name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BUILD="$(grep -E '^\s*version:' pubspec.yaml | sed -E 's/.*\+([0-9]+).*/\1/')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

      - run: flutter pub get

      # arm64-only keeps the OTA APK under Supabase Free's 50MB global upload limit.
      - run: flutter build apk --release --target-platform android-arm64

      - name: Rename APK
        shell: bash
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
            "cbs_app-${{ steps.version.outputs.version }}-android.apk"
          ls -lh "cbs_app-${{ steps.version.outputs.version }}-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: cbs_app-*-android.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v',''
          $pubspecVersionLine = (Select-String -Path "pubspec.yaml" -Pattern "^\s*version:\s*").Line
          $build = ($pubspecVersionLine -split "\+")[1].Trim()
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "build=$build" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - run: flutter pub get
      - run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer (.exe)
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path "build\installer" | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc "windows\installer.iss" /DMyAppName="CBS" /DMyAppVersion="$version" /DMyAppPublisher="CBS" /DMyAppURL="https://github.com/Tchana/cbs_app" /DMyAppExeName="cbs.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: build/installer/*.exe

  publish:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage dist
        id: meta
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BUILD="$(grep -E '^\s*version:' pubspec.yaml | sed -E 's/.*\+([0-9]+).*/\1/')"
          mkdir -p dist
          find artifacts -type f -name 'cbs_app-*-android.apk' -exec cp {} dist/ \;
          find artifacts -type f -name 'cbs_setup_*.exe' -exec cp {} dist/ \;
          NOTES="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" 2>/dev/null || true)"
          NOTES="${NOTES:-Release $VERSION}"
          NOTES_ESC="$(printf '%s' "$NOTES" | jq -Rs .)"
          cat > dist/version.json <<EOF
          {
            "version": "$VERSION",
            "build_number": ${BUILD:-1},
            "force_update": false,
            "min_version": "1.0.0",
            "release_notes": $NOTES_ESC,
            "assets": {
              "android": "android.apk",
              "windows": "windows-setup.exe",
              "web": "web.zip"
            }
          }
          EOF
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -la dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CBS ${{ steps.meta.outputs.version }}
          files: |
            dist/*
          draft: false
          prerelease: false

      - name: Verify Supabase upload secret
        run: |
          if [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "::error::Missing GitHub secret SUPABASE_SERVICE_ROLE_KEY"
            exit 1
          fi

      - name: Publish OTA artifacts to Supabase Storage
        env:
          SUPABASE_URL: https://owbbtxdqazdjijxetwmn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          chmod +x scripts/upload_release_to_supabase.sh
          ./scripts/upload_release_to_supabase.sh dist "${{ steps.meta.outputs.version }}"
